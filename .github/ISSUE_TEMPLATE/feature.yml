name: Feature request
description: An idea for the page, the CLI, the addon, or the docs
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help with?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this
